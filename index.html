<!doctype html>
<html lang="en" data-theme="night-athletic" data-accent="coral">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- TEMPORARY — #51. Remove with the Settings readout.
         The same sampler lived in main.tsx first and proved useless: its very
         first sample was stamped t=2725ms, because a module script doesn't run
         until parsing and the render-blocking stylesheets are done. The whole
         event being investigated is over by then. Inline and first in <head>
         is the only position that observes the page from t=0. -->
    <script>
      (function () {
        var vv = window.visualViewport;
        var measure = function () {
          var d = document.documentElement;
          return {
            t: Math.round(performance.now()),
            innerWidth: window.innerWidth,
            clientWidth: d.clientWidth,
            scrollWidth: d.scrollWidth,
            visualWidth: vv ? Math.round(vv.width) : -1,
            scale: vv ? Number(vv.scale.toFixed(2)) : -1,
          };
        };
        var key = function (m) {
          return [m.innerWidth, m.clientWidth, m.scrollWidth, m.visualWidth, m.scale].join("/");
        };
        var first = measure();
        var changes = [first];
        var last = key(first);
        var tick = function () {
          var m = measure();
          if (key(m) !== last) {
            changes.push(m);
            last = key(m);
          }
          if (m.t < 9000) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        window.__vp = {
          screen: window.screen.width + "x" + window.screen.height,
          dpr: window.devicePixelRatio,
          standalone: navigator.standalone === undefined ? null : navigator.standalone,
          displayMode: window.matchMedia("(display-mode: standalone)").matches
            ? "standalone"
            : "browser",
          changes: changes,
        };
      })();
    </script>

    <title>MyMacros</title>
    <meta
      name="description"
      content="Photograph your food, AI fills in the macros, and your daily calorie budget breathes with your running."
    />

    <!-- Ignored by iOS Safari in-browser — it tints from the body background
         instead (field-tested; see design/TOKENS.md). What it does in
         standalone/PWA mode is UNVERIFIED and is open question #39: measured
         on device, the page gradient runs to y=0 there, so black-translucent
         + viewport-fit=cover are what put content under the status bar, and
         theme-color paints nothing at the top. Set to --bg-top on the theory
         that it matters somewhere; don't state that it does until #39 closes.
         main.tsx keeps it in sync with --bg-top when the theme changes. -->
    <meta name="theme-color" content="#1a2230" />

    <!-- Same families the frozen sketches use, so the app and the design
         ground truth render identically. Self-hosting them (one less
         third-party dependency on first paint, and offline-safe) is #35. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- iOS home-screen install: no browser chrome, dark status bar text -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyMacros" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
