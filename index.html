<!doctype html>
<html lang="en" data-theme="night-athletic" data-accent="coral">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- The browser's default canvas is WHITE, and `color-scheme: dark` lives
         in design/tokens.css under :root[data-theme=...] — so it only takes
         effect once the stylesheet has been parsed. This meta applies from
         HTML parse instead, which is the one window nothing else in #53
         reaches: iOS drops the launch image when the web view starts
         painting, and if that first paint is the UA canvas rather than ours,
         it is white.

         Reported on device after #53 shipped ("a quick blip of white"), and
         **not reproducible in Chrome** — a screencast of the real production
         document over a throttled connection peaks at mean luminance 33/255
         with no bright frame anywhere. Same class as #38/#39: a standalone
         iOS behaviour the harness structurally cannot see.

         `dark` is the value for Night Athletic, which is the base pack — the
         boot script below rewrites it when a light theme is stored, and
         lib/theme.ts keeps it in step on every switch (#29). Otherwise a
         light-theme user gets this flash in reverse. -->
    <meta name="color-scheme" content="dark" />

    <!-- The theme, before anything paints (#29).
         =========================================
         `data-theme` on <html> above is the default. A user who picked another
         pack has it in their profile, which needs a session and a round trip —
         and #53's boot skeleton paints from the inlined stylesheet long before
         either. Without this, that user's app starts in the wrong theme and
         flips once /api/me answers, which is the same white-flash class of bug
         #53 was about, in colour.

         The value is a MIRROR of `profiles.theme`, never a source: the profile
         overwrites it on every load (App.tsx). It is parsed here rather than
         imported because this must run before the first module does.

         Inline and unconditional on purpose — a `src` would be a round trip in
         the window this exists to close. Kept to what it is: two attributes and
         a meta, no fallbacks beyond the try, because anything that throws here
         delays the app's own first paint. -->
    <script>
      try {
        var t = (localStorage.getItem("mymacros.theme") || "").split(" ");
        if (t[0] === "field-notes" || t[0] === "instrument") {
          document.documentElement.dataset.theme = t[0];
          document.querySelector('meta[name="color-scheme"]').content = "light";
        }
        if (t[1] === "gold" || t[1] === "mint") document.documentElement.dataset.accent = t[1];
      } catch (e) {
        /* private mode throws on read; the default in the tag above stands */
      }
    </script>

    <title>MyMacros</title>
    <meta
      name="description"
      content="Photograph your food, AI fills in the macros, and your daily calorie budget breathes with your running."
    />

    <!-- Ignored by iOS Safari in-browser — it tints from the body background
         instead (field-tested; see design/TOKENS.md). What it does in
         standalone/PWA mode is UNVERIFIED and is open question #39: measured
         on device, the page gradient runs to y=0 there, so black-translucent
         + viewport-fit=cover are what put content under the status bar, and
         theme-color paints nothing at the top. Set to --bg-top on the theory
         that it matters somewhere; don't state that it does until #39 closes.
         main.tsx keeps it in sync with --bg-top when the theme changes. -->
    <meta name="theme-color" content="#1a2230" />

    <!-- Fonts are ours now (#35). The three families the frozen sketches use
         are committed under src/client/styles/fonts/ and declared in
         fonts.css, which app.css imports — so they arrive as fingerprinted
         same-origin assets with no preconnect, no third-party DNS or TLS on
         the way to first paint, and nothing a service worker can't precache
         (#54). tools/fetch-fonts.mjs is the only thing that should write
         them; `npm run fonts -- --check` fails the build if they drift. -->

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- iOS home-screen install: no browser chrome, dark status bar text -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyMacros" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The frame iOS paints *before* the HTML arrives (#53). Nothing else in
         this file reaches it: the inlined CSS and the boot skeleton below both
         need the document, and without a startup image that frame is white.
         Each entry must match its device exactly or iOS ignores it silently,
         which is why the sizes and the media queries are generated from one
         table — `npm run icons`. -->
    <!-- launch-images:start — generated by tools/make-icons.mjs, do not edit -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/icons/launch-640x1136.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/icons/launch-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1242x2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/icons/launch-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/icons/launch-1320x2868.png" />
    <!-- launch-images:end -->
  </head>
  <body>
    <div id="root">
      <!-- Boot skeleton (#53). `<div id="root"></div>` alone meant first paint
           was an empty box even once the stylesheets stopped blocking it, so
           the app's own dark frame appears here with no JavaScript at all.

           **This is `.splash` because that is byte-for-byte what App.tsx
           renders while the session is pending** — same element, same class,
           same attribute. So there is no second source of truth to drift, no
           handoff flash when React mounts, and no layout shift: the markup
           React replaces this with is the markup that is already here.

           The tab bar is deliberately NOT here. Copying it would restate
           TabBar.tsx — its motif-slot log button, its NavLink active states,
           its icon geometry — in a file no test renders, which is the exact
           two-things-that-should-be-one-thing defect the register in
           CLAUDE.md exists to stop. An empty `.tabbar` is worse than none:
           its height comes from `.tab`'s content, so it would paint a 21px
           strip and then jump to 61px. The white screen is gone without it. -->
      <main class="splash" aria-busy="true"></main>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
