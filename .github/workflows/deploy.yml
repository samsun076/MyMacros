name: Deploy

# Migrate, then deploy — in that order, mechanically, so it cannot be forgotten
# (#136).
#
# ## One repo, one instance
#
# **This workflow deploys the instance belonging to the repository it is running
# in, and nothing else.** Your fork deploys your instance from your fork, with
# your Cloudflare credentials in your fork's own settings. Nobody holds anybody
# else's token.
#
# It did not always say that. Until 2026-08-28 this file carried a second job
# (`wife:`) for deploying another person's instance from THIS repo, using
# credentials stored here and a `wrangler.wife.jsonc` that never existed in the
# tree. That was the shortcut, and it was ruled out: the wife's and daughter's
# instances are treated as strangers, on their own Cloudflare and GitHub
# accounts, precisely so the path that gets exercised is the one a self-hoster
# actually walks rather than a family arrangement that hides its defects.
#
# The corollary, and the reason the second job could not simply be kept: with one
# instance per repo there is one wrangler config, `wrangler.jsonc`, edited in
# place. A `--config` flag threaded through `deploy`, `db:migrate:remote`,
# `preflight` and every step here is one rule stated five times, and the failure
# when a caller forgets it is silent — it reads the committed config and operates
# against somebody else's instance without saying so. #140 is that bug already
# shipped. A merge conflict in `wrangler.jsonc` is the loud alternative, and
# upstream touches that file about twice a year (6 changes in 249 commits, the
# last on the project's sixth day).
#
# ## Why this exists rather than Workers Builds
#
# Workers Builds is a dashboard setting pointed at a repo, and it deploys on
# push. It **cannot run migrations**. So the ordered pair that matters —
# migrate first, deploy second — is half automatic and half a thing somebody
# remembers, and the failure when they don't is #129's: the Worker boots, the
# app loads, every query answers, and the first request touching a new column
# 500s.
#
# ## Inert until switched on
#
# The deploy job is gated on a repository *variable*, not a secret, because a
# workflow that fails on every push for want of a token is worse than no
# workflow. Nothing here runs until someone sets `DEPLOY_PRIMARY` to `true` and
# adds their credentials.
#
# ## Switching it on, in your own fork
#
#   0. GitHub disables Actions on a new fork. Open the **Actions** tab and click
#      "I understand my workflows, go ahead and enable them". Nothing below runs
#      until you do, and no error says so.
#   1. In your Cloudflare account: My Profile → API Tokens → Create, using the
#      "Edit Cloudflare Workers" template, plus D1 Edit. Copy the token and the
#      Account ID.
#   2. In your fork: Settings → Secrets and variables → Actions.
#        secret   CF_API_TOKEN_PRIMARY
#        secret   CF_ACCOUNT_ID_PRIMARY
#        variable DEPLOY_PRIMARY = true
#        variable APP_URL_PRIMARY = https://your-host
#
# `PRIMARY` is the name of the only job here; it does not mean "the author's".
# In your fork it is yours.

# ── Two channels, and the split is the point (#137) ──────────
#
# **main** is the author's own instance. He is the canary: the defects no
# automated check can see are the ones he finds by opening the app, so his
# instance takes every commit and breakage there is cheap. Commits land several
# a day and some correct the one before.
#
# (This comment said "every defect this project has ever found" and cited six
# commits on 2026-08-25. Both were wrong — that day had two — and #138's sweep
# caught them. Rule 4a applies to a figure in a comment as much as to a claim
# about a screenshot.)
#
# **a `v*` tag** is everybody else. One known-good point to converge on, so "the
# same app, run the same way" is true and "what version are you on" has an
# answer. A tag rather than a schedule: a monthly release ships whatever happens
# to be on main that morning, where a tag ships what somebody decided was good.
# Trigger, not calendar — the same rule as build rules 4b and 10.
#
# ⚠️ **HOW A TAG REACHES A FORK IS UNSOLVED — see #141.** Measured 2026-08-27:
# GitHub's *Sync fork* button transfers branches and not tags; a fork created
# with the default option carries zero tags at all; `git push` never pushes tags
# without `--tags`; and Actions are off by default in a fork. Any one of those
# alone stops an upstream tag from ever starting a run here. So the `tags:`
# trigger below is correct about intent and currently unreachable in practice for
# anyone but the author. Do not read it as a working channel.
#
# In YOUR fork, `main` is your main and the job below fires on your pushes to it.
# That is the channel that works today.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # One deploy at a time per branch. Two overlapping runs could interleave a
  # migration with the other's deploy, which is the exact ordering this file
  # exists to guarantee.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # `npm run build` runs check + test, and push-to-main is the only gate this
    # workflow has. A red test must stop a deploy, not annotate one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  primary:
    needs: gate
    # main only. A tag is already on main, so without the ref test this would
    # deploy twice for one commit.
    if: vars.DEPLOY_PRIMARY == 'true' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PRIMARY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID_PRIMARY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── the ordered pair ──────────────────────────────────────
      # Migrate first. An unused column costs nothing; code expecting a column
      # that isn't there 500s. `--remote` with no pending migrations is a no-op
      # that prints an empty table, so this is unconditional on purpose — a step
      # you never have to decide about cannot be decided wrong.
      - name: Migrate
        run: npx wrangler d1 migrations apply mymacros-db --remote

      - name: Build
        run: npm run build

      # Not `npm run deploy`: that also runs the build, and the gate job above
      # already ran the tests. The preflight is kept — it is the thing that
      # refuses to overwrite another instance (#127).
      - name: Preflight
        run: npm run preflight

      - name: Deploy
        run: npx wrangler deploy

      # The honest post-deploy check, and the reason #129 exists. `ok` is false
      # if the database is unreachable OR older than the code, so this catches a
      # deploy that landed against the wrong database as well as one that raced
      # its own migration.
      - name: Verify
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsS "${{ vars.APP_URL_PRIMARY }}/api/health" || echo '{}')
            echo "$body"
            if [ "$(echo "$body" | jq -r '.ok')" = "true" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::/api/health never reported ok:true after the deploy"
          exit 1
